<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 紐西蘭南北島 16 天金秋自駕之旅</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #0284c7;
      --primary-light: #e0f2fe;
      --secondary: #059669;
      --secondary-light: #d1fae5;
      --accent: #d97706;
      --accent-light: #fef3c7;
      --rose: #e11d48;
      --rose-light: #ffe4e6;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* 頂部橫幅 */
    .hero {
      background: linear-gradient(135deg, #0f172a 0%, #0369a1 100%);
      color: white;
      padding: 26px 16px 22px;
      text-align: center;
    }
    .hero-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.15);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .hero h1 { font-size: 21px; font-weight: 800; margin-bottom: 4px; }
    .hero p { font-size: 13px; color: #bae6fd; }

    /* 頂部可滑動分頁導覽列 (支援6個分頁) */
    .nav-tabs {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      -webkit-overflow-scrolling: touch;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex: 0 0 auto;
      border: none;
      background: none;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: rgba(2, 132, 199, 0.05);
    }

    /* 內容容器 */
    .container { max-width: 680px; margin: 0 auto; padding: 16px; }
    .page { display: none; }
    .page.active { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin: 16px 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text);
    }

    /* 導航按鈕卡片 */
    .map-card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .map-card h3 { font-size: 15px; margin-bottom: 6px; color: var(--text); }
    .map-card p { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    .map-btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .btn-south { background: linear-gradient(135deg, #0284c7, #0369a1); }
    .btn-north { background: linear-gradient(135deg, #059669, #047857); }

    /* 總覽數據網格 */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-box {
      background: var(--card);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .stat-label { font-size: 11px; color: var(--muted); }
    .stat-val { font-size: 13px; font-weight: 700; color: var(--text); margin-top: 2px; }

    /* 每日行程卡片 */
    .day-card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .day-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .day-badge {
      background: var(--primary);
      color: white;
      font-size: 12px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 6px;
    }
    .day-badge.north-badge { background: var(--secondary); }
    .day-date { font-size: 12px; font-weight: 600; color: var(--muted); }
    .day-title { font-size: 16px; font-weight: 700; margin-bottom: 10px; color: var(--text); }
    
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .tag {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .tag-drive { background: var(--accent-light); color: var(--accent); }
    .tag-stay { background: var(--secondary-light); color: var(--secondary); }

    .item-list { list-style: none; }
    .item-list li {
      font-size: 13px;
      color: #334155;
      margin-bottom: 6px;
      padding-left: 14px;
      position: relative;
    }
    .item-list li::before {
      content: "•";
      color: var(--primary);
      font-weight: bold;
      position: absolute;
      left: 0;
    }
    .hl { color: var(--primary); font-weight: 700; }

    /* 資訊與美食卡片 */
    .info-card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .info-card h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .city-pill {
      font-size: 11px;
      background: var(--primary-light);
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 12px;
    }

    /* 購物清單與行前檢核表 (互動勾選樣式) */
    .check-group {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    .check-group h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 8px;
      border-top: 1px solid #f1f5f9;
      cursor: pointer;
      transition: background 0.15s;
      border-radius: 8px;
    }
    .check-item:first-of-type { border-top: none; }
    .check-item
